[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raspilapse"
# src/__version__.py is the single source of truth. See [tool.setuptools.dynamic].
dynamic = ["version"]
description = "A Python library for creating timelapses with Raspberry Pi Camera"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["raspberry-pi", "camera", "timelapse", "photography", "picamera2"]
authors = [
    {name = "Terje Nesthus", email = "terje@ekstremedia.no"}
]
maintainers = [
    {name = "Terje Nesthus", email = "terje@ekstremedia.no"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# picamera2 is deliberately absent: it must come from apt, not pip.
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "numpy>=1.21.0",
    "astral>=3.2",
    "requests>=2.28.0",
]

[project.optional-dependencies]
# Streams the daily video upload instead of buffering ~300 MB in memory.
upload = ["requests-toolbelt>=1.0.0"]
# Only scripts/db_graphs.py and scripts/graph_solar_patterns.py need these.
graphs = ["matplotlib>=3.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.14.0",
    # Pinned exactly: black's stable style changes between yearly releases, so
    # a floating version guarantees CI rejects locally-formatted code.
    "black==25.11.0",
    "mypy>=1.0.0",
    "packaging>=21.0",
]

[project.urls]
"Homepage" = "https://github.com/ekstremedia/raspilapse"
"Bug Tracker" = "https://github.com/ekstremedia/raspilapse/issues"
"Documentation" = "https://github.com/ekstremedia/raspilapse#readme"
"Source Code" = "https://github.com/ekstremedia/raspilapse"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "hardware: marks tests that require actual camera hardware",
]

[tool.mypy]
python_version = "3.9"
# Every src/ module supports being imported both as `src.x` and as bare `x`,
# because the systemd units run the scripts directly. mypy sees the fallback
# arm of that try/except as a redefinition. It is deliberate and project-wide,
# so flagging it at ~40 sites is noise rather than signal.
disable_error_code = ["no-redef"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main\\(",
    "raise NotImplementedError",
]

[tool.setuptools.dynamic]
version = {attr = "src.__version__.__version__"}

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear.
#
# UP (pyupgrade) is deliberately not enabled yet: it wants ~200 changes,
# mostly typing.Dict -> dict, which is a large mechanical diff worth doing on
# its own rather than mixed into feature work.
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501",  # line length is black's job
    "B008",  # function call in an argument default -- used for timedelta defaults
]

[tool.ruff.lint.per-file-ignores]
# The dual-import idiom (try src.x / except x) needs imports after sys.path edits.
"src/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
# Tests bind results to names for readability even when only the side effect
# matters, and often ignore the loop index. Neither is worth flagging there.
"tests/*.py" = ["E402", "F841", "B007"]
