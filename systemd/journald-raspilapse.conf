# Raspilapse journald limits.
#
# Installed by scripts/install.sh to /etc/systemd/journald.conf.d/.
#
# Without this, journald defaults to min(10% of the filesystem, 4 GB). On a Pi
# with a 117 GB card that means the journal grows to ~4 GB and stays there --
# a capture service that logs every 30 seconds for months will fill it.
#
# 200 MB is roughly a month of raspilapse output at the default log level.

[Journal]
SystemMaxUse=200M
MaxRetentionSec=1month
