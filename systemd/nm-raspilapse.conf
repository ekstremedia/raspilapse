# Installed to /etc/NetworkManager/conf.d/99-raspilapse.conf by
#     ./scripts/install.sh --with-netwatch
#
# Applies on the next activation, so installing it changes nothing until the
# wifi next reconnects.

[connection]
# The Pi's brcmfmac drops beacons in power-save mode, and a missed beacon during
# an access point reboot or a band roam is how association turns into
# "Authentication timed out" -- which NetworkManager then reads as a bad
# password. Turning power save off makes that first domino less likely to fall.
wifi.powersave = 2

# There is deliberately nothing here about autoconnect.
#
# When NM decides credentials are wrong it ends at:
#     state change: need-auth -> failed (reason 'no-secrets')
# which sets an autoconnect *blocked reason* on the profile, not a retry
# counter. connection.autoconnect-retries=-1 was already in force on this
# camera when it sat offline for eight and a half hours, and did nothing,
# because retries are not what is blocked. Only an agent supplying secrets, an
# explicit `nmcli con up`/`dev connect`, a change to the profile's secrets, or
# an NM restart clears it.
#
# That is what scripts/check_network.sh is for. No setting in this file can
# replace it.
