# Raspilapse configuration.
#
# Copy to config/config.yml and edit. Everything not set here has a default
# in raspilapse/config.py, so this file only needs to contain what you want to
# change -- it used to be 681 lines, which is a lot to read before taking a
# first photograph.
#
# Every available setting is documented in docs/CONFIG-REFERENCE.yml. Copy the
# blocks you want into config.yml; leave the rest alone and the defaults apply.

# ---------------------------------------------------------------- required --

location:
  # Used to record the sun's elevation with each frame. Wrong coordinates do
  # not stop the camera working -- exposure is decided from measured
  # brightness, not from the clock.
  latitude: 68.7
  longitude: 15.4
  timezone: Europe/Oslo

output:
  # Where frames are written. Must exist and be writable by the service user.
  directory: /var/www/html/images
  # Used in every filename, so pick something without spaces.
  project_name: timelapse

# ------------------------------------------------------- worth setting soon --

camera:
  resolution:
    width: 3840
    height: 2160
  transforms:
    horizontal_flip: false
    vertical_flip: false

adaptive_timelapse:
  # Seconds between frames. 30 is a good starting point: fast enough for
  # weather to move, slow enough for a 20-second night exposure to finish.
  interval: 30
  # Overall brightness. Raise for brighter images, lower for darker.
  reference_lux: 3.8

video:
  directory: /var/www/html/videos

logging:
  # INFO while setting up, WARNING once it is running unattended.
  level: WARNING

database:
  # Records exposure, brightness and weather per frame. The graph and stats
  # tools read it; nothing breaks without it.
  enabled: true
  path: data/timelapse.db

# ------------------------------------------------------------- optional -----
#
# Left off by default. See docs/CONFIG-REFERENCE.yml for what each one takes.
#
#   overlay        burn camera settings, time and weather into each frame
#   weather        fetch observations to display and record
#   video_upload   POST the daily video to a server
#   barentswatch   ship positions, from a separate feed service
#   tide           tide levels, from a separate feed service
#   aurora         aurora forecast, from a separate feed service

overlay:
  enabled: false
